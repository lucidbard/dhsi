<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local Ollama Chat</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <h1>Chat with <code>minimax-m3:cloud</code></h1>
      <p class="chat__status" id="status">connecting…</p>
    </header>

    <ol class="chat__log" id="log" aria-live="polite"></ol>

    <form class="chat__form" id="form" autocomplete="off">
      <input
        class="chat__input"
        id="input"
        type="text"
        placeholder="Type a message and press Enter…"
        required
        autofocus
      />
      <button class="chat__send" type="submit">Send</button>
    </form>
  </main>
  <script src="chat.js"></script>
</body>
</html>
